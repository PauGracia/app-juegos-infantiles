<!-- Página del juego de adivinar palabras -->

<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=no"
    />
    <title>Escribe el nombre</title>
    <link rel="stylesheet" href="../../assets/css/app.css?v=20251111" />
    <link rel="stylesheet" href="palabras.css?v=20251111" />
  </head>

  <body>
    <!-- Modal-->
    <div class="modal-palabras" id="modal">
      <div class="modal-contentPalabras">
        <h2>Configuración</h2>
        <label for="idioma">Idioma:</label>
        <select id="idioma">
          <option value="0" selected>Castellano</option>

          <option value="1">Catalán</option>
          <option value="2">Inglés</option>
        </select>
        <br /><br />
        <label for="cantidad">Número de imágenes:</label>
        <input type="number" id="cantidad" min="1" max="56" value="3" />
        <br /><br />
        <button onclick="iniciarJuego()">Iniciar</button>
      </div>
    </div>

    <!--Estructura de la pantalla-->

    <div class="contenedor-imagenPalabra" id="juego" style="display: none">
      <!-- El titulo comparte estilo con el titulo de oiperaciones -->
      <h1 class="titulo-operaciones">Palabras</h1>

      <div class="imagen-contenedor">
        <img id="imagen" class="imagen-palabras" src="" alt="" />
      </div>

      <div class="letras-palabras" id="inputs"></div>
      <div class="botones-palabras">
        <button onclick="comprobar()">Comprobar</button>
        <button id="btnSiguiente" onclick="siguiente()" disabled>
          Siguiente
        </button>
        <button id="salir-palabras" class="salir-btn">Salir</button>
      </div>
    </div>
    <div class="modal-palabras" id="modal-final" style="display: none">
      <div class="modal-contentPalabras">
        <h2>Resultado final</h2>

        <p>✅ Aciertos: <span id="total-aciertos"></span></p>
        <p>❌ Errores: <span id="total-errores"></span></p>
        <br />

        <ul id="lista-resultados"></ul>

        <br />
        <button class="btn-final" onclick="reiniciarJuego()">Reiniciar</button>
        <button class="btn-final" onclick="salirJuego()">Salir</button>
      </div>
    </div>

    <div class="panel-info" id="panel-info">
      <p>
        Palabra <span id="info-actual">1</span> de
        <span id="info-total">5</span>
      </p>
      <p>✅ Aciertos: <span id="info-aciertos">0</span></p>
      <p>❌ Errores: <span id="info-errores">0</span></p>
    </div>

    <script src="../../assets/js/elementos.js"></script>
    <script src="palabras.js"></script>
  </body>
</html>
