<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=no"
    />

    <title>El Ahorcado</title>
    <link rel="stylesheet" href="../../assets/css/app.css?v=20251111" />
    <link rel="stylesheet" href="juegoAhorcado.css" />
  </head>

  <body class="body-ahorcado">
    <h1 class="titulo-ahorcado">El Ahorcado</h1>
    <div id="marcador-ahorcado">0</div>

    <!-- Modal de inicio -->
    <div id="modal-inicio">
      <div id="modal-contenido">
        <h2>Inicia tu juego</h2>
        <input type="text" id="usuario" placeholder="Nombre de usuario" />
        <br />

        <button onclick="iniciarAhorcado()">Empezar</button>

        <button onclick="window.location.href='../ranking/rankingLocal.html'">
          Ver ranking
        </button>
        <label for="idioma">Idioma:</label>
        <select id="idioma">
          <option value="es">Español</option>
          <option value="ca">Català</option>
          <option value="en">English</option>
        </select>
      </div>
    </div>

    <div class="contenedor-juego">
      <div class="imagen-ahorcado">
        <svg id="ahorcadoSVG" width="225" height="225" viewBox="0 0 300 300">
          <!-- Poste -->
          <line id="poste" class="parte" x1="50" y1="260" x2="200" y2="260" />
          <line
            id="vertical"
            class="parte"
            x1="100"
            y1="260"
            x2="100"
            y2="40"
          />
          <line
            id="horizontal"
            class="parte"
            x1="100"
            y1="40"
            x2="180"
            y2="40"
          />
          <line id="cuerda" class="parte" x1="180" y1="40" x2="180" y2="70" />

          <!-- Muñeco -->
          <circle id="cabeza" class="parte" cx="180" cy="90" r="20" />
          <line id="cuerpo" class="parte" x1="180" y1="110" x2="180" y2="170" />
          <line id="brazo1" class="parte" x1="180" y1="130" x2="150" y2="150" />
          <line id="brazo2" class="parte" x1="180" y1="130" x2="210" y2="150" />
          <line
            id="pierna1"
            class="parte"
            x1="180"
            y1="170"
            x2="150"
            y2="210"
          />
          <line
            id="pierna2"
            class="parte"
            x1="180"
            y1="170"
            x2="210"
            y2="210"
          />
        </svg>
      </div>

      <div>
        <div class="palabra" id="palabra"></div>
        <div class="letras" id="letras"></div>
      </div>
    </div>
    <div class="boton-volver-ahorcado">
      <button id="btnSalir">Salir</button>
    </div>

    <!-- Modal informativo reutilizable -->
    <div id="modal-info" class="modal-ranking" style="display: none">
      <div class="modal-ranking-contenido">
        <h3 id="modal-info-titulo">Información</h3>
        <p id="modal-info-texto"></p>
        <button onclick="cerrarModalInfo()">Aceptar</button>
      </div>
    </div>
    <!-- Modal final -->
    <div id="modal-final" style="display: none">
      <div id="modal-final-contenido">
        <h2>Fin del juego</h2>
        <p id="resultado"></p>
        <button onclick="reiniciarCompleto()">Volver a jugar</button>
        <button onclick="window.location.href='../../index.html'">Salir</button>

        <div class="modal-final-acciones">
          <button onclick="guardarPuntuacionLocal()">
            Guardar récord local
          </button>
          <button onclick="window.location.href='../ranking/rankingLocal.html'">
            Ver ranking
          </button>

          <button onclick="exportarRanking()">Exportar ranking</button>
        </div>
      </div>
    </div>

    <script src="../../assets/js/palabras.js"></script>
    <script src="juegoAhorcado.js"></script>
  </body>
</html>
