<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=no"
    />
    <meta
      http-equiv="Content-Security-Policy"
      content="
        default-src 'self';
        script-src 'self';
        style-src 'self' 'unsafe-inline';
        img-src 'self' data:;
        media-src 'self';
      "
    />
    <title data-i18n="menu.ahorcado">El Ahorcado</title>
    <link rel="stylesheet" href="../../assets/css/app.css?v=20251111" />
    <link rel="stylesheet" href="juegoAhorcado.css" />
    <script
      src="../../assets/js/i18n.js"
      data-i18n-path="../../assets/i18n/"
    ></script>
  </head>

  <body class="body-ahorcado">
    <!-- ================================ -->
    <!-- SPLASH SCREEN DE CARGA (AHORCADO) -->
    <!-- ================================ -->
    <div id="splash-screen-ahorcado">
      <img
        src="../../assets/img/iconos/ahorcado.png"
        alt="Cargando Ahorcado..."
      />
    </div>
    <h1 class="titulo-ahorcado mobile-title" data-i18n="menu.ahorcado">
      El Ahorcado
    </h1>
    <div id="marcador-ahorcado" class="mobile-score">0</div>

    <!-- Modal de inicio -->
    <div id="modal-inicio" style="display: none">
      <div id="modal-contenido">
        <img
          src="../../assets/img/iconos/ahorcado.png"
          alt="Ahorcado"
          class="modal-icono-ahorcado"
        />
        <h2 data-i18n="ahorcado.startGame">Inicia tu juego</h2>

        <label for="usuario" data-i18n="ahorcado.username"
          >Nombre de usuario:</label
        >
        <input
          type="text"
          id="usuario"
          data-i18n-placeholder="ahorcado.usernamePlaceholder"
        />
        <br /><br />

        <!-- SELECTOR DE IDIOMA DEL JUEGO -->
        <label for="idioma-juego" data-i18n="ahorcado.gameLanguage"
          >Idioma del juego:</label
        >
        <select id="idioma-juego">
          <option value="es" data-i18n="language.es">Español</option>
          <option value="ca" data-i18n="language.ca">Català</option>
          <option value="en" data-i18n="language.en">English</option>
          <option value="it" data-i18n="language.it">Italian</option>
          <option value="pt" data-i18n="language.pt">Portuguese</option>
          <option value="fr" data-i18n="language.fr">Frances</option>
        </select>
        <br /><br />

        <button
          id="btnEmpezar"
          class="btn-icon btn-iniciar"
          data-i18n="common.start"
        >
          Empezar
        </button>
        <button
          id="btnInstrucciones"
          class="btn-icon btn-instrucciones"
          data-i18n="common.instructions"
        >
          Instrucciones
        </button>
        <button
          id="btnVerRanking"
          class="btn-icon btn-ranking"
          data-i18n="ahorcado.viewRanking"
        >
          Ver ranking
        </button>
        <button
          id="btnSalir-modal"
          class="btn-icon btn-salir"
          data-i18n="common.exitMenu"
        >
          Salir
        </button>
      </div>
    </div>
    <div class="contenedor-juego mobile-container">
      <button id="btnPista" class="btn-pista-redondo" aria-label="Pista">
        <svg viewBox="0 0 24 24" width="24" height="24">
          <path
            fill="currentColor"
            d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"
          />
          <path fill="currentColor" d="M12 10h-2v2H9v-2H7V9h2V7h1v2h2v1z" />
        </svg>
      </button>
      <div class="imagen-contenedor">
        <!-- Botón de pista redondo con lupa -->

        <div class="imagen-ahorcado">
          <svg id="ahorcadoSVG" width="225" height="225" viewBox="0 0 300 300">
            <!-- Poste -->
            <line id="poste" class="parte" x1="50" y1="260" x2="200" y2="260" />
            <line
              id="vertical"
              class="parte"
              x1="100"
              y1="260"
              x2="100"
              y2="40"
            />
            <line
              id="horizontal"
              class="parte"
              x1="100"
              y1="40"
              x2="180"
              y2="40"
            />
            <line id="cuerda" class="parte" x1="180" y1="40" x2="180" y2="70" />

            <!-- Muñeco -->
            <circle id="cabeza" class="parte" cx="180" cy="90" r="20" />
            <line
              id="cuerpo"
              class="parte"
              x1="180"
              y1="110"
              x2="180"
              y2="170"
            />
            <line
              id="brazo1"
              class="parte"
              x1="180"
              y1="130"
              x2="150"
              y2="150"
            />
            <line
              id="brazo2"
              class="parte"
              x1="180"
              y1="130"
              x2="210"
              y2="150"
            />
            <line
              id="pierna1"
              class="parte"
              x1="180"
              y1="170"
              x2="150"
              y2="210"
            />
            <line
              id="pierna2"
              class="parte"
              x1="180"
              y1="170"
              x2="210"
              y2="210"
            />
          </svg>
        </div>
      </div>
      <div class="palabra-contenedor">
        <div class="palabra" id="palabra"></div>
        <div class="letras" id="letras"></div>
      </div>
    </div>
    <div class="boton-volver-ahorcado mobile-footer">
      <button id="btnSalir" class="btn-icon btn-salir" data-i18n="common.exit">
        Salir
      </button>
    </div>

    <!-- Modal de confirmación de salida -->
    <div class="modal-palabras" id="modal-confirm-exit" style="display: none">
      <div class="modal-contentPalabras">
        <h2 data-i18n="common.confirmExit">¿Seguro que quieres salir?</h2>
        <div class="botones-configuracion">
          <button
            id="btn-confirm-yes"
            class="btn-modal btn-modal--blue"
            data-i18n="common.confirmYes"
          >
            Sí
          </button>
          <button
            id="btn-confirm-no"
            class="btn-modal btn-modal--red"
            data-i18n="common.confirmNo"
          >
            No
          </button>
        </div>
      </div>
    </div>

    <!-- Modal informativo reutilizable -->
    <div id="modal-info" class="modal-ranking" style="display: none">
      <div class="modal-ranking-contenido">
        <h3 id="modal-info-titulo" data-i18n="common.info">Información</h3>
        <div class="modal-scroll-container">
          <p id="modal-info-texto"></p>
        </div>
        <button id="btnModalInfoAceptar" data-i18n="common.accept">
          Aceptar
        </button>
      </div>
    </div>
    <!-- Modal final -->
    <div id="modal-final" style="display: none">
      <div id="modal-final-contenido">
        <h2 data-i18n="ahorcado.gameOver">Fin del juego</h2>
        <p id="resultado"></p>
        <button id="btnReiniciar" data-i18n="ahorcado.playAgain">
          Volver a jugar
        </button>
        <button id="btnSalirFinal" data-i18n="common.exitMenu">Salir</button>

        <div class="modal-final-acciones">
          <button id="btnGuardarRecord" data-i18n="ahorcado.record">
            Guardar récord
          </button>

          <button id="btnVerRankingFinal" data-i18n="ahorcado.viewRanking">
            Ver ranking
          </button>

          <button id="btnExportarRanking" data-i18n="ahorcado.exportRanking">
            Exportar ranking
          </button>
        </div>
      </div>
    </div>

    <script src="../../assets/js/palabras.js"></script>
    <script src="juegoAhorcado.js"></script>
  </body>
</html>
