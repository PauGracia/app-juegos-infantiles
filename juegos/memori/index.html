<!-- Paguina del juego del memori -->
<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title data-i18n="menu.memori">Emparejar</title>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta
      http-equiv="Content-Security-Policy"
      content="
        default-src 'self';
        script-src 'self';
        style-src 'self' 'unsafe-inline';
        img-src 'self' data:;
        media-src 'self';
      "
    />

    <link rel="stylesheet" href="../../assets/css/app.css?v=20251111" />
    <link rel="stylesheet" href="memori.css" />
    <script
      src="../../assets/js/i18n.js"
      data-i18n-path="../../assets/i18n/"
    ></script>
  </head>
  <body id="body-memori">
    <!-- ================================ -->
    <!-- SPLASH SCREEN DE CARGA (MEMORI) -->
    <!-- ================================ -->
    <div id="splash-screen-memori">
      <img src="../../assets/img/iconos/memori.png" alt="Cargando Memori..." />
    </div>

    <!-- Pantalla de victoria especial para modo desafío -->
    <div id="victory-screen">
      <div class="victory-content">
        <img
          src="../../assets/img/iconos/campeon.png"
          alt="Victoria!"
          class="victory-trophy"
        />
        <div class="victory-text" data-i18n="memori.victoryTitle">
          ¡VICTORIA!
        </div>
      </div>
    </div>

    <div class="header">
      <h1 id="titulo-memori" data-i18n="menu.memori">Emparejar</h1>

      <div id="marcador">0</div>
    </div>
    <!-- Modal de selección de modo -->
    <div id="modal-inicio" class="modal-memori mostrar">
      <div class="modal-contentMemori">
        <img
          src="../../assets/img/iconos/memori.png"
          alt="Memori"
          class="modal-icono-memori"
        />
        <h2 data-i18n="memori.selectMode">Selecciona un modo</h2>

        <button id="modoNormal" data-i18n="memori.normal">Modo Normal</button>
        <button id="modoDesafio" data-i18n="memori.challenge">
          Modo Desafío
        </button>
        <button id="rankingInicio" data-i18n="memori.ranking">Ranking</button>

        <button id="instruccionesBtn" data-i18n="memori.instructions">
          Instrucciones
        </button>

        <button id="salirInicio" class="salir-btn" data-i18n="common.exit">
          Salir
        </button>
      </div>
    </div>

    <!-- Modal de instrucciones -->
    <div id="modal-instrucciones">
      <div class="modal-contentInstrucciones">
        <h2 data-i18n="memori.instructionsTitle">Instrucciones</h2>

        <p data-i18n="memori.instructionsIntro"></p>

        <ul>
          <li data-i18n="memori.instructionsNormal"></li>
          <li data-i18n="memori.instructionsChallenge"></li>
          <li data-i18n="memori.instructionsRanking"></li>
        </ul>

        <p data-i18n="memori.instructionsEnd"></p>

        <button id="cerrarInstrucciones" data-i18n="common.close">
          Cerrar
        </button>
      </div>
    </div>

    <!-- Pantalla principal juego -->
    <div class="zona-juego">
      <div class="tablero" id="tablero"></div>

      <div class="ui-lateral">
        <div id="ranking"></div>
        <button id="salir-juego-memori" data-i18n="common.exit">Salir</button>
      </div>
    </div>

    <!-- Modal Victoria -->
    <div id="modal-memori" class="modal-memori">
      <div class="modal-contentMemori">
        <h2 data-i18n="memori.congrats">¡Enhorabuena!</h2>
        <p data-i18n="memori.askSaveRecord">¿Quieres guardar tu récord?</p>
        <div id="registro" style="display: none; margin-top: 10px">
          <input
            type="text"
            id="nombreJugador"
            placeholder="Tu nombre"
            data-placeholder-i18n="memori.playerNamePlaceholder"
          />
          <button
            id="registrar"
            class="registrar-btn"
            data-i18n="memori.register"
          >
            Registrar
          </button>
        </div>
        <button id="guardar" class="guardar-btn" data-i18n="memori.saveRecord">
          Guardar récord
        </button>

        <!-- Botones principales abajo -->
        <div class="botones">
          <button id="salir" class="salir-btn" data-i18n="common.exit">
            Salir
          </button>
          <button
            id="reiniciar"
            class="reiniciar-btn"
            data-i18n="common.restart"
          >
            Reiniciar
          </button>
          <button
            id="ranking-btn"
            class="ranking-btn"
            data-i18n="memori.ranking"
          >
            Ranking
          </button>
        </div>
      </div>
    </div>
    <script src="../../assets/js/elementos.js"></script>

    <script src="memori.js"></script>
  </body>
</html>
