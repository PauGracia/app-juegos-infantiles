<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Ranking Ahorcado</title>
    <link rel="stylesheet" href="../assets/css/styles.css" />
  </head>

  <body class="body-ranking">
    <header class="ranking-header">
      <h1>🏆 Ranking Ahorcado</h1>
    </header>

    <section class="ranking-controles">
      <select id="ordenRanking">
        <option value="puntos">Ordenar por puntos</option>
        <option value="fecha">Ordenar por fecha</option>
        <option value="usuario">Ordenar por nombre</option>
      </select>

      <input type="text" id="filtroUsuario" placeholder="Filtrar por usuario" />

      <button id="btnLimpiarFiltro">Limpiar</button>
    </section>

    <section class="ranking-lista">
      <ul id="listaRanking"></ul>
    </section>

    <footer class="ranking-footer">
      <button id="btnVolverJuego">Volver al juego</button>
      <button id="btnBorrarRanking" class="danger">Borrar ranking</button>
    </footer>

    <script src="../assets/js/juegos.js"></script>
  </body>
</html>
