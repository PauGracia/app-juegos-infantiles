<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=no"
    />
    <meta
      http-equiv="Content-Security-Policy"
      content="
        default-src 'self';
        script-src 'self';
        style-src 'self' 'unsafe-inline';
        img-src 'self' data:;
        media-src 'self';
      "
    />
    <title>Juego de damas</title>
    <link rel="stylesheet" href="../../assets/css/app.css?v=20251111" />
    <link rel="stylesheet" href="damas.css?v=20251111" />

    <script
      src="../../assets/js/i18n.js"
      data-i18n-path="../../assets/i18n/"
    ></script>
  </head>
  <body class="body-damas">
    <!-- ================================ -->
    <!-- SPLASH SCREEN DE CARGA -->
    <!-- ================================ -->
    <div id="splash-screen-damas">
      <img src="../../assets/img/iconos/damas.png" alt="Cargando Damas..." />
    </div>

    <h1 class="titulo-damas" data-i18n="damas.title"></h1>

    <!-- Modal configuración inicial -->
    <div id="modal-config-damas" class="modal-fin-damas" style="display: none">
      <div class="modal-contenido modal-configuracion modal-config-inicial">
        <img
          src="../../assets/img/iconos/damas.png"
          alt="Damas"
          class="modal-icono-damas"
        />
        <h2 data-i18n="damas.config.initialTitle">Opciones Iniciales</h2>

        <!-- Boton instrucciones -->
        <div class="config-bloque config-instrucciones">
          <button
            class="boton-damas boton-instrucciones-modal"
            id="boton-instrucciones-modal"
            data-i18n="damas.instructions"
          >
            Instrucciones
          </button>
        </div>

        <!-- Botones finales -->
        <div class="botones-modal dos-botones">
          <button
            id="boton-partida-rapida"
            data-i18n="damas.config.quickGame"
          ></button>
          <button
            id="boton-configuracion-partida"
            data-i18n="damas.config.gameSetup"
          ></button>
        </div>

        <div class="botones-modal un-boton">
          <button
            id="boton-salir-config"
            data-i18n="damas.config.exit"
          ></button>
        </div>
      </div>
    </div>

    <!-- Nuevo modal configuración de partida -->
    <div
      id="modal-config-partida"
      class="modal-fin-damas"
      style="display: none"
    >
      <div class="modal-contenido modal-configuracion">
        <img
          src="../../assets/img/iconos/damas.png"
          alt="Damas"
          class="modal-icono-damas"
        />
        <h2 data-i18n="damas.config.title">Configuración de partida</h2>

        <div class="config-bloque config-jugadores">
          <label for="selector-jugadores" data-i18n="damas.config.selectPlayer"
            >Seleccionar jugador:</label
          >

          <!-- Selector personalizado de jugadores -->
          <div class="custom-select" id="selector-jugadores-container">
            <div
              class="select-selected"
              id="jugador-selected"
              data-i18n="damas.config.noPlayer"
            >
              Sin jugador
            </div>
            <div class="select-items select-hide" id="jugador-options"></div>
          </div>

          <!-- Botones de gestión de jugadores  -->
          <div class="botones-jugadores-vertical">
            <button
              class="boton-damas boton-crear-jugador"
              id="btn-crear-jugador"
              data-i18n="damas.config.createPlayer"
            >
              Crear jugador
            </button>
            <button
              class="boton-damas boton-borrar-jugador"
              id="btn-borrar-jugador"
              data-i18n="damas.config.deletePlayer"
            >
              Borrar jugador
            </button>
          </div>
        </div>

        <!-- Sorteo -->
        <div class="config-bloque">
          <button
            class="boton-damas"
            id="boton-sortear-colores"
            data-i18n="damas.config.shuffleColors"
          ></button>

          <!-- Espacio reservado para el resultado -->
          <div id="resultado-sorteo" class="resultado-sorteo">—</div>
        </div>

        <!-- Nivel IA -->
        <div class="config-item">
          <label for="nivel-ia" data-i18n="damas.config.aiLevel"></label>

          <div class="custom-select" id="nivel-ia-container">
            <div class="select-selected" id="nivel-ia-selected"></div>
            <div class="select-items select-hide" id="nivel-ia-options"></div>

            <select id="nivel-ia" style="display: none">
              <option value="normal" data-i18n="damas.config.aiNormal">
                Normal
              </option>
              <option value="dificil" data-i18n="damas.config.aiHard">
                Difícil
              </option>
            </select>
          </div>
        </div>

        <!-- Checkbox sugerencias -->
        <div class="config-bloque checkbox-bloque">
          <label>
            <input type="checkbox" id="check-sugerencias" checked />
            <span data-i18n="damas.config.enableHints"></span>
          </label>
        </div>

        <!-- Botones finales -->
        <div class="botones-modal dos-botones">
          <button
            id="boton-inicio-partida"
            data-i18n="damas.config.startGame"
          ></button>
          <button
            id="boton-volver-config"
            data-i18n="damas.config.back"
          ></button>
        </div>
      </div>
    </div>
    <div id="modal-aviso-damas" class="modal-fin-damas" style="display: none">
      <div class="modal-contenido">
        <h3 id="modal-aviso-texto" data-i18n="damas.warning.title"></h3>
        <button
          class="boton-damas"
          id="boton-cerrar-aviso"
          data-i18n="common.accept"
        ></button>
      </div>
    </div>

    <div class="contenedor-juego-damas">
      <div id="juego-damas-contenedor">
        <div id="tablero-damas"></div>
      </div>

      <div class="panel-y-botones">
        <div class="info-panel-damas">
          <div>
            <b data-i18n="damas.jugadores2">Jugador:</b>
            <span id="jugador-actual-info">—</span>
          </div>
          <div>
            <b data-i18n="damas.yourPieces">Les teves peces:</b>
            <span id="color-humano-info">—</span>
          </div>

          <div>
            <b data-i18n="damas.yourSide">Torn:</b>
            <span id="turno-info">—</span>
          </div>
          <div>
            <b data-i18n="damas.timeLeft">Tiempo restante:</b>
            <span id="tiempo-restante-info">05:00</span>
          </div>

          <div>
            <b data-i18n="damas.forcedCaptures">Captures obligatòries:</b>
            <span id="captura-obligatoria-info">—</span>
          </div>

          <div>
            <b data-i18n="damas.yourCaptures">Les teves captures:</b>
            <span id="capturas-humano-info">0</span>
          </div>

          <div>
            <b data-i18n="damas.aiCaptures">Captures MÀQUINA:</b>
            <span id="capturas-ia-info">0</span>
          </div>
          <div>
            <b data-i18n="damas.jugadores">Jugador:</b>
            <span id="">0</span>
          </div>
        </div>

        <div class="contenedor-botones-damas">
          <button
            class="boton-damas"
            id="btn-jugadores"
            data-i18n="damas.jugadores"
          >
            jugadores
          </button>

          <button id="salirDamas" class="boton-damas" data-i18n="damas.exit">
            Reiniciar
          </button>
        </div>
      </div>
    </div>
    <!-- Modal de fin de partida -->
    <div id="modal-fin-damas" class="modal-fin-damas">
      <div class="modal-contenido">
        <div id="icono-resultado" class="icono-resultado"></div>
        <h2 id="mensaje-resultado"></h2>
        <div class="botones-modal">
          <button
            class="boton-damas"
            id="boton-reiniciar-modal"
            data-i18n="common.playAgain"
          >
            Volver a jugar
          </button>

          <button class="boton-damas" id="btn-salir-fin" data-i18n="damas.exit">
            Salir
          </button>
        </div>
      </div>
    </div>

    <!-- Modal de confirmación de salida -->
    <div id="modal-confirm-exit" class="modal-fin-damas" style="display: none">
      <div class="modal-contenido modal-confirmacion">
        <h2 data-i18n="common.confirmExit">¿Seguro que quieres salir?</h2>
        <div class="botones-modal">
          <button
            id="btn-confirm-yes"
            class="boton-damas"
            data-i18n="common.confirmYes"
          >
            Sí
          </button>
          <button
            id="btn-confirm-no"
            class="boton-damas"
            data-i18n="common.confirmNo"
          >
            No
          </button>
        </div>
      </div>
    </div>

    <div
      id="modal-instrucciones-damas"
      class="modal-fin-damas"
      style="display: none"
    >
      <div class="modal-contenido modal-instrucciones">
        <h2 data-i18n="damas.howToPlay">Cómo jugar a las damas</h2>

        <p
          class="texto-instrucciones-damas"
          data-i18n="damas.instructionsText"
        ></p>

        <div class="botones-modal">
          <button
            class="boton-damas"
            id="boton-cerrar-instrucciones"
            data-i18n="damas.exit"
          >
            Salir
          </button>
        </div>
      </div>
    </div>
    <script src="damas.js"></script>
  </body>
</html>
