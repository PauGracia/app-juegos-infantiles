<!-- Página de operaciones matemáticas -->

<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Operaciones</title>
    <link rel="stylesheet" href="../../assets/css/app.css?v=20251111" />
    <link rel="stylesheet" href="operaciones.css" />
  </head>
  <body class="body-operaciones">
    <!-- Fondo de pantalla -->

    <!-- Modal -->
    <div class="modal-operaciones" id="modal-operaciones">
      <div class="modal-content">
        <h2>Configuración de Operaciones</h2>

        <label for="nivel">Nivel de dificultad:</label><br />
        <select id="nivel" onchange="cambiarNivel()">
          <option value="1">Nivel 1 (fácil)</option>
          <option value="2">Nivel 2 (avanzado)</option>
        </select>
        <br /><br />

        <div class="modal-inputs">
          <input
            type="number"
            id="input-operaciones"
            placeholder="Número de operaciones (máx 50)"
            min="1"
            max="50"
          />
          <input
            type="number"
            id="input-maximo"
            placeholder="Número Operador (solo nivel 1)"
            min="0"
            max="1000"
          />
        </div>

        <!-- Opciones Nivel 2 -->
        <div id="opciones-nivel2" class="nivel2-opciones oculto">
          <h3>Operaciones permitidas</h3>

          <label><input type="checkbox" id="op-suma" checked /> Sumas</label
          ><br />
          <label><input type="checkbox" id="op-resta" checked /> Restas</label
          ><br />

          <label
            ><input type="checkbox" id="op-multi" checked />
            Multiplicaciones</label
          ><br />
          <label><input type="checkbox" id="op-div" checked /> Divisiones</label
          ><br />
          <label class="sub-opcion">
            <input type="checkbox" id="resta-negativa" checked />
            Permitir resultado negativo </label
          ><br /><br />

          <input
            type="number"
            id="input-maximo-nivel2"
            placeholder="Número máximo coeficiente"
            min="1"
            max="1000"
          />
        </div>

        <button onclick="iniciar()">Iniciar</button>
      </div>
    </div>
    <!-- Pantalla principal -->
    <h1 class="titulo-operaciones">Operaciones</h1>

    <div class="operaciones-pizarra" id="pizarra"></div>

    <div class="botones-operaciones">
      <button onclick="comprobarRespuestas()">Comprobar</button>
      <button onclick="location.reload()">Reiniciar</button>
    </div>

    <div id="boton-salir-operaciones">
      <button onclick="window.location.href='../../index.html'">Salir</button>
    </div>

    <!-- Modal final-->
    <div class="modal-aviso oculto" id="modal-final">
      <div class="modal-aviso-content">
        <h2>Juego terminado 🎉</h2>

        <p id="resumen-general"></p>
        <div id="estadisticas-operaciones"></div>

        <div class="bloque-detalles">
          <details>
            <summary>Operaciones correctas</summary>
            <ul id="lista-bien"></ul>
          </details>

          <details>
            <summary>Operaciones incorrectas</summary>
            <ul id="lista-mal"></ul>
          </details>
        </div>

        <button onclick="location.reload()">Reiniciar</button>
        <button onclick="window.location.href='../../index.html'">Salir</button>
      </div>
    </div>

    <!-- Modal de aviso/informativo -->
    <div class="modal-aviso oculto" id="modal-aviso">
      <div class="modal-aviso-content">
        <p id="mensaje-aviso">Este es un mensaje de prueba</p>
        <button onclick="cerrarModalAviso()">Aceptar</button>
      </div>
    </div>

    <script src="operaciones.js"></script>
  </body>
</html>
